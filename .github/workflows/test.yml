name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        timezone: [UTC, Asia/Tokyo, America/New_York]
    runs-on: ubuntu-latest
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx prettier --check 'src/**/*.{ts,tsx}' package.json
